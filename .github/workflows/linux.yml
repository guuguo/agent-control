name: Linux Compatibility

on:
  push:
    branches: [main]
    paths:
      - "src/**"
      - "scripts/**"
      - "desktop/linux/**"
      - "tests/**"
      - "install.sh"
      - "uninstall.sh"
      - "package*.json"
      - ".github/workflows/linux.yml"
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  linux:
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-24.04, ubuntu-24.04-arm]
        node: [22, 24]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci --no-audit --no-fund
      - name: Check syntax and Linux installers
        run: |
          npm run check
          bash -n install.sh uninstall.sh scripts/local-control.sh desktop/linux/install-app.sh
          python3 -c "import ast, pathlib; [ast.parse(p.read_text()) for p in [pathlib.Path('desktop/linux/agent-control.py'), pathlib.Path('tests/linux-desktop-smoke.py')]]"
      - name: Linux paths, service, updates and zero-token CLI protocols
        run: >-
          node --test --test-concurrency=1
          tests/linux-service.test.mjs tests/platform.test.mjs
          tests/service-restart.test.mjs tests/update-service.test.mjs
          tests/hub-server.test.mjs tests/codex-provider.test.mjs
          tests/thread-fork.test.mjs tests/fork-history-pagination.test.mjs
          tests/thread-pin.test.mjs tests/mobile-thread-menu.test.mjs
          tests/claude-provider.test.mjs tests/antigravity-provider.test.mjs
          tests/grok-provider.test.mjs tests/qoder-provider.test.mjs
      - name: Install native desktop test dependencies
        if: matrix.node == 24
        run: |
          # x64 runner 的 EC2 镜像源下载 WebKit 极慢，改用 Ubuntu 官方 HTTPS 源。
          sudo find /etc/apt -type f \( -name '*.sources' -o -name '*.list' -o -name 'apt-mirrors.txt' \) -exec \
            sed -i -E 's|http://[^ /]*ec2\.archive\.ubuntu\.com/ubuntu|https://archive.ubuntu.com/ubuntu|g' {} +
          sudo apt-get update
          sudo apt-get install -y python3-gi gir1.2-gtk-3.0 gir1.2-webkit2-4.1 xvfb dbus-x11 desktop-file-utils
      - name: Native GTK/WebKit window, navigation, download and desktop entry
        if: matrix.node == 24
        run: xvfb-run -a dbus-run-session -- /usr/bin/python3 tests/linux-desktop-smoke.py
      - uses: actions/upload-artifact@v4
        if: matrix.node == 24 && always()
        with:
          name: linux-desktop-${{ matrix.runner }}
          path: /tmp/agent-control-linux-desktop.png
          if-no-files-found: ignore
